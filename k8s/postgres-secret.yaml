# Dev-only credentials, mirroring docker-compose.yml's postgres service.
# Never reuse these values outside local development.
apiVersion: v1
kind: Secret
metadata:
  name: axi-taskboard-postgres-secret
  labels:
    app.kubernetes.io/name: axi-taskboard
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: axitaskboard
  POSTGRES_PASSWORD: axitaskboard-dev-only
  POSTGRES_DB: axitaskboard
  DATABASE_URL: postgresql://axitaskboard:axitaskboard-dev-only@axi-taskboard-postgres:5432/axitaskboard
