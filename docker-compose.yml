services:
  postgres:
    image: postgres:16-alpine
    container_name: axi-taskboard-postgres
    restart: unless-stopped
    environment:
      # Dev-only default credentials. Never use these values outside local development.
      POSTGRES_USER: axitaskboard
      POSTGRES_PASSWORD: axitaskboard-dev-only
      POSTGRES_DB: axitaskboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - axi-taskboard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axitaskboard -d axitaskboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: axi-taskboard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Internal compose-network URL: service name "postgres", not localhost.
      DATABASE_URL: postgresql://axitaskboard:axitaskboard-dev-only@postgres:5432/axitaskboard
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  axi-taskboard-pgdata:
