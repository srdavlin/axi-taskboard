apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: axi-taskboard-pgdata
  labels:
    app.kubernetes.io/name: axi-taskboard
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: axi-taskboard-postgres
  labels:
    app.kubernetes.io/name: axi-taskboard
    app.kubernetes.io/component: postgres
spec:
  serviceName: axi-taskboard-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: axi-taskboard
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axi-taskboard
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: axi-taskboard-postgres-secret
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "axitaskboard", "-d", "axitaskboard"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "axitaskboard", "-d", "axitaskboard"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: axi-taskboard-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: axi-taskboard-postgres
  labels:
    app.kubernetes.io/name: axi-taskboard
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/name: axi-taskboard
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
