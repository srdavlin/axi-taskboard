apiVersion: apps/v1
kind: Deployment
metadata:
  name: axi-taskboard-backend
  labels:
    app.kubernetes.io/name: axi-taskboard
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: axi-taskboard
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axi-taskboard
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          # Built locally from backend/Dockerfile and loaded into kind via
          # `kind load docker-image` — not pulled from a registry. See
          # AGENTS.md "Kubernetes deployment".
          image: axi-taskboard-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: axi-taskboard-postgres-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/tasks
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/tasks
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: axi-taskboard-backend
  labels:
    app.kubernetes.io/name: axi-taskboard
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: axi-taskboard
    app.kubernetes.io/component: backend
  ports:
    - port: 3001
      targetPort: 3001
